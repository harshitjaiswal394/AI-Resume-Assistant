name: Terraform PR Plan

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to target for manual run
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - prod
      apply:
        description: Allow terraform apply for dev only
        required: true
        default: false
        type: boolean

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  pr-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - test
          - prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validate environment
        run: |
          case "${{ matrix.environment }}" in
            dev|test|prod) ;;
            *)
              echo "Invalid environment: ${{ matrix.environment }}"
              exit 1
              ;;
          esac

      - name: Terraform Init
        working-directory: infra/envs/${{ matrix.environment }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=jobgpt/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        working-directory: infra/envs/${{ matrix.environment }}
        env:
          TF_VAR_nvidia_api_key: ${{ secrets.NVIDIA_API_KEY }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/envs/${{ matrix.environment }}
        env:
          TF_VAR_nvidia_api_key: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          terraform plan \
            -var="backend_image_tag=${{ github.event.pull_request.head.sha }}" \
            -var="frontend_image_tag=${{ github.event.pull_request.head.sha }}"

  manual-plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ inputs.environment }}
      apply: ${{ inputs.apply }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validate environment
        run: |
          case "${{ inputs.environment }}" in
            dev|test|prod) ;;
            *)
              echo "Invalid environment: ${{ inputs.environment }}"
              exit 1
              ;;
          esac

      - name: Terraform Init
        working-directory: infra/envs/${{ inputs.environment }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=jobgpt/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        working-directory: infra/envs/${{ inputs.environment }}
        env:
          TF_VAR_nvidia_api_key: ${{ secrets.NVIDIA_API_KEY }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/envs/${{ inputs.environment }}
        env:
          TF_VAR_nvidia_api_key: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          terraform plan \
            -var="backend_image_tag=${{ github.sha }}" \
            -var="frontend_image_tag=${{ github.sha }}"

  manual-apply-dev:
    if: github.event_name == 'workflow_dispatch' && inputs.apply == true && inputs.environment == 'dev'
    needs: manual-plan
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/envs/dev
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=jobgpt/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply
        working-directory: infra/envs/dev
        env:
          TF_VAR_nvidia_api_key: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          terraform apply -auto-approve \
            -var="backend_image_tag=${{ github.sha }}" \
            -var="frontend_image_tag=${{ github.sha }}"
