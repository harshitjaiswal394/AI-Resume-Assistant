name: Deploy Dev via Terraform

on:
  pull_request:
    branches:
      - main
      - dev-dns
  workflow_dispatch:

env:
  TF_DIR: infra/envs/dev
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:

# =========================
# STAGE 1: PLAN
# =========================
  terraform-plan:
    runs-on: ubuntu-latest
    environment: dev

    outputs:
      plan_status: success

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=jobgpt/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Format Check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_nvidia_api_key: ${{ secrets.NVIDIA_API_KEY }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_nvidia_api_key: ${{ secrets.NVIDIA_API_KEY }}
        run: terraform plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan

# =========================
# STAGE 2: APPLY (WITH APPROVAL)
# =========================
  terraform-apply:
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: dev   

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=jobgpt/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply (Approved)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_nvidia_api_key: ${{ secrets.NVIDIA_API_KEY }}
        run: terraform apply -auto-approve tfplan

      - name: Wait for ECS services
        working-directory: ${{ env.TF_DIR }}
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          BACKEND_SERVICE=$(terraform output -raw backend_service_name)
          FRONTEND_SERVICE=$(terraform output -raw frontend_service_name)

          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "$BACKEND_SERVICE" "$FRONTEND_SERVICE"

      - name: Deployment summary
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "Frontend URL: $(terraform output -raw frontend_url)"
          echo "Cluster: $(terraform output -raw cluster_name)"
          echo "Namespace: $(terraform output -raw namespace_name)"