name: Deploy Dev via Terraform

on:
  pull_request:
    branches:
      - main
      - dev-dns
  workflow_dispatch:

env:
  TF_DIR: infra/envs/dev
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:

# =========================
# STAGE 1: PLAN + BUILD
# =========================
  terraform-plan:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=jobgpt/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_nvidia_api_key: ${{ secrets.NVIDIA_API_KEY }}
        run: terraform plan -out=tfplan

      - name: Bootstrap Infra (ECR, IAM, Cluster)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_nvidia_api_key: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          terraform apply -auto-approve \
            -target=module.default_network \
            -target=module.app_secrets \
            -target=module.ecr \
            -target=module.iam \
            -target=module.cluster \
            -target=module.security_groups

      - name: Export ECR repos
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "BACKEND_REPO=$(terraform output -raw backend_repository_url)" >> $GITHUB_ENV
          echo "FRONTEND_REPO=$(terraform output -raw frontend_repository_url)" >> $GITHUB_ENV

      - name: Login to ECR
        run: |
          aws ecr get-login-password | docker login \
          --username AWS \
          --password-stdin \
          "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build and push backend image
        run: |
          docker build -t "$BACKEND_REPO:${GITHUB_SHA}" ./backend
          docker tag "$BACKEND_REPO:${GITHUB_SHA}" "$BACKEND_REPO:latest"
          docker push "$BACKEND_REPO:${GITHUB_SHA}"
          docker push "$BACKEND_REPO:latest"

      - name: Build and push frontend image
        run: |
          docker build -t "$FRONTEND_REPO:${GITHUB_SHA}" ./frontend
          docker tag "$FRONTEND_REPO:${GITHUB_SHA}" "$FRONTEND_REPO:latest"
          docker push "$FRONTEND_REPO:${GITHUB_SHA}"
          docker push "$FRONTEND_REPO:latest"

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan

# =========================
# STAGE 2: APPLY (APPROVED)
# =========================
  terraform-apply:
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: dev   

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=jobgpt/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_nvidia_api_key: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          terraform apply -auto-approve \
            -var="backend_image_tag=${GITHUB_SHA}" \
            -var="frontend_image_tag=${GITHUB_SHA}"

      - name: Wait for ECS services
        working-directory: ${{ env.TF_DIR }}
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          BACKEND_SERVICE=$(terraform output -raw backend_service_name)
          FRONTEND_SERVICE=$(terraform output -raw frontend_service_name)

          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "$BACKEND_SERVICE" "$FRONTEND_SERVICE"

      - name: Deployment summary
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "Frontend URL: $(terraform output -raw frontend_url)"
          echo "Cluster: $(terraform output -raw cluster_name)"
          echo "Namespace: $(terraform output -raw namespace_name)"