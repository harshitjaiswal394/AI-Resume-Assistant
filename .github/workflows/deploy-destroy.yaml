name: 🚀 Deploy / 💣 Destroy AWS ECS

run-name: >-
  ${{ 
    github.event.inputs.destroy == 'true'
    && format('💣 Destroy Infra {0}', github.event.inputs.environment)
    || format('🚀 Deploy Infra {0}', github.event.inputs.environment)
  }}


on:
  pull_request:
    branches:
      - main
    types:
      - closed

  workflow_dispatch:
    inputs:
      destroy:
        description: "Set true to destroy infrastructure"
        required: true
        default: "false"
      environment:
        description: "Environment (dev/test/prod)"
        required: true
        default: "dev"

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:

# =========================
# DEPLOY JOB
# =========================
  deploy:
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.event.inputs.destroy != 'true') }}
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Validate Environment
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          if [[ ! "$ENV" =~ ^(dev|test|prod)$ ]]; then
            echo "❌ Invalid environment: $ENV"
            exit 1
          fi

      - name: Set Dynamic Variables
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"

          echo "ECS_CLUSTER=${ENV}-jobgpt-cluster" >> $GITHUB_ENV
          echo "ECS_NAMESPACE=${ENV}-jobgpt" >> $GITHUB_ENV

          echo "BACKEND_SERVICE=${ENV}-backend-service" >> $GITHUB_ENV
          echo "FRONTEND_SERVICE=${ENV}-frontend-service" >> $GITHUB_ENV

          echo "ECR_BACKEND_REPO=${ENV}-backend-repo" >> $GITHUB_ENV
          echo "ECR_FRONTEND_REPO=${ENV}-frontend-repo" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECS Cluster Ready
        run: |
          STATUS=$(aws ecs describe-clusters \
            --clusters $ECS_CLUSTER \
            --query 'clusters[0].status' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          if [ "$STATUS" = "ACTIVE" ]; then
            echo "Cluster exists"

          elif [ "$STATUS" = "DEPROVISIONING" ]; then
            echo "Waiting for deletion..."
            sleep 30
            aws ecs create-cluster --cluster-name $ECS_CLUSTER

          else
            aws ecs create-cluster --cluster-name $ECS_CLUSTER
          fi

      - name: Create Namespace
        run: |
          NS=$(aws servicediscovery list-namespaces \
            --query "Namespaces[?Name=='$ECS_NAMESPACE'].Id" \
            --output text)

          if [ -z "$NS" ]; then
            aws servicediscovery create-private-dns-namespace \
              --name $ECS_NAMESPACE \
              --vpc $(aws ec2 describe-vpcs --query 'Vpcs[0].VpcId' --output text)
          fi

      - name: Login to ECR
        run: |
          aws ecr get-login-password | docker login \
          --username AWS \
          --password-stdin \
          $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Create ECR Repositories (if not exists)
        run: |
          for repo in $ECR_BACKEND_REPO $ECR_FRONTEND_REPO
          do
            EXISTS=$(aws ecr describe-repositories \
              --repository-names $repo \
              --query 'repositories[0].repositoryName' \
              --output text 2>/dev/null || echo "NOT_FOUND")

            if [ "$EXISTS" = "NOT_FOUND" ]; then
              echo "Creating ECR repo: $repo"
              aws ecr create-repository --repository-name $repo
              sleep 10
            else
              echo "ECR repo exists: $repo"
            fi
          done

      - name: Create CloudWatch Log Groups
        run: |
          for svc in $BACKEND_SERVICE $FRONTEND_SERVICE
          do
            LOG_GROUP="/ecs/$ECS_CLUSTER/$svc"

            EXISTS=$(aws logs describe-log-groups \
              --log-group-name-prefix $LOG_GROUP \
              --query 'logGroups[0].logGroupName' \
              --output text 2>/dev/null)

            if [ "$EXISTS" != "$LOG_GROUP" ]; then
              echo "Creating log group: $LOG_GROUP"
              aws logs create-log-group --log-group-name $LOG_GROUP
            else
              echo "Log group exists: $LOG_GROUP"
            fi
          done

      - name: Build & Push Images
        run: |
          docker build -t backend ./backend
          docker tag backend:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND_REPO:latest
          docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND_REPO:latest

          docker build -t frontend ./frontend
          docker tag frontend:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPO:latest
          docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPO:latest

      - name: Debug Task Def Inputs
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          echo "ENVIRONMENT='$ENVIRONMENT'"
          echo "ECS_CLUSTER='$ECS_CLUSTER'"
          echo "BACKEND_SERVICE='$BACKEND_SERVICE'"
          echo "AWS_REGION='$AWS_REGION'"
          echo "NVIDIA_API_KEY length: ${#NVIDIA_API_KEY}"

      - name: Prepare Backend Task Definition
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          LOG_GROUP="/ecs/$ECS_CLUSTER/$BACKEND_SERVICE"
          IMAGE="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND_REPO:latest"
          API_URL="http://$BACKEND_SERVICE.$ECS_NAMESPACE:8000"

          jq \
            --arg IMAGE "$IMAGE" \
            --arg LOG_GROUP "$LOG_GROUP" \
            --arg AWS_REGION "$AWS_REGION" \
            --arg ENVIRONMENT "${ENVIRONMENT:-dev}" \
            --arg API_URL "$API_URL" \
            --arg NVIDIA_API_KEY "$NVIDIA_API_KEY" \
            '
            .containerDefinitions[0].image = $IMAGE |
            .containerDefinitions[0].logConfiguration.options["awslogs-group"] = $LOG_GROUP |
            .containerDefinitions[0].logConfiguration.options["awslogs-region"] = $AWS_REGION |
            .containerDefinitions[0].environment = [
              { "name": "ENVIRONMENT", "value": $ENVIRONMENT },
              { "name": "API_BASE_URL", "value": $API_URL },
              { "name": "NVIDIA_API_KEY", "value": $NVIDIA_API_KEY }
            ]
            ' backend/backend-task.json > backend-task-final.json

      - name: Prepare Frontend Task Definition
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          LOG_GROUP="/ecs/$ECS_CLUSTER/$FRONTEND_SERVICE"
          IMAGE="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPO:latest"
          BACKEND_URL="http://$BACKEND_SERVICE:8000"

          jq \
            --arg IMAGE "$IMAGE" \
            --arg LOG_GROUP "$LOG_GROUP" \
            --arg AWS_REGION "$AWS_REGION" \
            --arg ENVIRONMENT "${ENVIRONMENT:-dev}" \
            '
            .containerDefinitions[0].image = $IMAGE |
            .containerDefinitions[0].logConfiguration.options["awslogs-group"] = $LOG_GROUP |
            .containerDefinitions[0].logConfiguration.options["awslogs-region"] = $AWS_REGION |
            .containerDefinitions[0].environment = [
              { "name": "ENVIRONMENT", "value": $ENVIRONMENT }
            ]
            ' frontend/frontend-task.json > frontend-task-final.json

      - name: Register Task Definitions
        run: |
          aws ecs register-task-definition --cli-input-json file://backend-task-final.json
          aws ecs register-task-definition --cli-input-json file://frontend-task-final.json

      - name: Get VPC and Subnet Info
        run: |
          DEFAULT_VPC=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query 'Vpcs[0].VpcId' --output text --region ${{ env.AWS_REGION }})
          SUBNETS=$(aws ec2 describe-subnets --filters Name=vpc-id,Values=$DEFAULT_VPC --query 'Subnets[*].SubnetId' --output text --region ${{ env.AWS_REGION }})
          SUBNET_ARRAY=$(echo $SUBNETS | awk '{print $1}')

          echo "DEFAULT_VPC=$DEFAULT_VPC" >> $GITHUB_ENV
          echo "SUBNETS=$SUBNETS" >> $GITHUB_ENV
          echo "SUBNET_ARRAY=$SUBNET_ARRAY" >> $GITHUB_ENV

          echo "VPC: $DEFAULT_VPC"
          echo "Subnets: $SUBNETS"

      - name: Create/Update Backend Service
        run: |
          SERVICE_EXISTS=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $BACKEND_SERVICE \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].serviceName' \
            --output text 2>/dev/null)

          if [ "$SERVICE_EXISTS" == "$BACKEND_SERVICE" ]; then
            echo "Updating existing Backend service"
            aws ecs update-service \
              --cluster $ECS_CLUSTER \
              --service $BACKEND_SERVICE \
              --task-definition backend \
              --enable-execute-command \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}
          else
            echo "Creating new Backend service with Service Connect"

            SG_ID=$(aws ec2 describe-security-groups \
              --filters Name=vpc-id,Values=${{ env.DEFAULT_VPC }} Name=group-name,Values=default \
              --query 'SecurityGroups[0].GroupId' \
              --output text \
              --region ${{ env.AWS_REGION }})

            SUBNET_LIST=$(echo ${{ env.SUBNETS }} | awk '{for(i=1;i<=NF;i++) printf "\"%s\"%s", $i, (i<NF ? "," : "")}')

            aws ecs create-service \
              --cluster $ECS_CLUSTER \
              --service-name $BACKEND_SERVICE \
              --task-definition backend \
              --desired-count 1 \
              --enable-execute-command \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_LIST],securityGroups=[\"$SG_ID\"],assignPublicIp=ENABLED}" \
              --service-connect-configuration "{\
                \"enabled\": true,\
                \"namespace\": \"$ECS_NAMESPACE\",\
                \"services\": [{\
                  \"portName\": \"backend-8000\",\
                  \"discoveryName\": \"$BACKEND_SERVICE\",\
                  \"clientAliases\": [{\"port\": 8000, \"dnsName\": \"$BACKEND_SERVICE\"}]\
                }]\
              }" \
              --region ${{ env.AWS_REGION }} \
              --tags key=Service,value=backend key=Environment,value=${{ github.event.inputs.environment }}
          fi
          echo "Backend service ready"

      - name: Create/Update Frontend Service
        run: |
          SERVICE_EXISTS=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $FRONTEND_SERVICE \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].serviceName' \
            --output text 2>/dev/null)

          if [ "$SERVICE_EXISTS" == "$FRONTEND_SERVICE" ]; then
            echo "Updating existing Frontend service"
            aws ecs update-service \
              --cluster $ECS_CLUSTER \
              --service $FRONTEND_SERVICE \
              --task-definition frontend \
              --force-new-deployment \
              --enable-execute-command \
              --region ${{ env.AWS_REGION }}
          else
            echo "Creating new Frontend service with Service Connect"

            SG_ID=$(aws ec2 describe-security-groups \
              --filters Name=vpc-id,Values=${{ env.DEFAULT_VPC }} Name=group-name,Values=default \
              --query 'SecurityGroups[0].GroupId' \
              --output text \
              --region ${{ env.AWS_REGION }})

            SUBNET_LIST=$(echo ${{ env.SUBNETS }} | awk '{for(i=1;i<=NF;i++) printf "\"%s\"%s", $i, (i<NF ? "," : "")}')

            aws ecs create-service \
              --cluster $ECS_CLUSTER \
              --service-name $FRONTEND_SERVICE \
              --task-definition frontend \
              --desired-count 1 \
              --launch-type FARGATE \
              --enable-execute-command \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_LIST],securityGroups=[\"$SG_ID\"],assignPublicIp=ENABLED}" \
              --service-connect-configuration "{\
                \"enabled\": true,\
                \"namespace\": \"$ECS_NAMESPACE\",\
                \"services\": [{\
                  \"portName\": \"frontend-80\",\
                  \"discoveryName\": \"$FRONTEND_SERVICE\",\
                  \"clientAliases\": [{\"port\": 80, \"dnsName\": \"$FRONTEND_SERVICE\"}]\
                }]\
              }" \
              --region ${{ env.AWS_REGION }} \
              --tags key=Service,value=frontend key=Environment,value=${{ env.ENVIRONMENT }}
          fi
          echo "Frontend service ready"

      - name: Verify Deployment
        run: |
          echo "Waiting for services to stabilize..."
          sleep 180

          BACKEND_STATUS=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $BACKEND_SERVICE \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].status' \
            --output text)

          FRONTEND_STATUS=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $FRONTEND_SERVICE \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].status' \
            --output text)

          echo "Backend Service Status: $BACKEND_STATUS"
          echo "Frontend Service Status: $FRONTEND_STATUS"

          BACKEND_TASKS=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $BACKEND_SERVICE \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].runningCount' \
            --output text)

          FRONTEND_TASKS=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $FRONTEND_SERVICE \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].runningCount' \
            --output text)

          echo "Backend Running Tasks: $BACKEND_TASKS"
          echo "Frontend Running Tasks: $FRONTEND_TASKS"

# =========================
# DESTROY JOB
# =========================
  destroy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.destroy == 'true' }}
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Validate Environment
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [[ ! "$ENV" =~ ^(dev|test|prod)$ ]]; then
            echo "❌ Invalid environment"
            exit 1
          fi

      - name: Set Dynamic Variables
        run: |
          ENV="${{ github.event.inputs.environment }}"

          echo "ECS_CLUSTER=${ENV}-jobgpt-cluster" >> $GITHUB_ENV
          echo "ECS_NAMESPACE=${ENV}-jobgpt" >> $GITHUB_ENV

          echo "BACKEND_SERVICE=${ENV}-backend-service" >> $GITHUB_ENV
          echo "FRONTEND_SERVICE=${ENV}-frontend-service" >> $GITHUB_ENV

          echo "ECR_BACKEND_REPO=${ENV}-backend-repo" >> $GITHUB_ENV
          echo "ECR_FRONTEND_REPO=${ENV}-frontend-repo" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete ECS Services
        run: |
          for svc in $BACKEND_SERVICE $FRONTEND_SERVICE
          do
            aws ecs update-service --cluster $ECS_CLUSTER --service $svc --desired-count 0 || true
            sleep 10
            aws ecs delete-service --cluster $ECS_CLUSTER --service $svc --force || true
          done

      - name: Delete Cloud Map Services
        run: |
          NS_ID=$(aws servicediscovery list-namespaces \
            --query "Namespaces[?Name=='$ECS_NAMESPACE'].Id" \
            --output text)

          if [ ! -z "$NS_ID" ]; then
            for svc in $(aws servicediscovery list-services \
              --filters Name=NAMESPACE_ID,Values=$NS_ID \
              --query 'Services[*].Id' \
              --output text)
            do
              aws servicediscovery delete-service --id $svc || true
            done
          fi

      - name: Delete Namespace
        run: |
          NS_ID=$(aws servicediscovery list-namespaces \
            --query "Namespaces[?Name=='$ECS_NAMESPACE'].Id" \
            --output text)

          if [ ! -z "$NS_ID" ]; then
            aws servicediscovery delete-namespace --id $NS_ID || true
          fi

      - name: Delete Task Definitions
        run: |
          for family in backend frontend
          do
            ARNS=$(aws ecs list-task-definitions \
              --family-prefix $family \
              --query 'taskDefinitionArns[]' \
              --output text)

            for arn in $ARNS; do
              echo "Deregistering: $arn"
              aws ecs deregister-task-definition \
                --task-definition $arn || true
            done
          done

      - name: Delete Cluster
        run: |
          aws ecs delete-cluster --cluster $ECS_CLUSTER || true

      - name: Delete ECR Repos
        run: |
          for repo in $ECR_BACKEND_REPO $ECR_FRONTEND_REPO
          do
            aws ecr delete-repository --repository-name $repo --force || true
          done

      - name: Cleanup Logs
        run: |
          for svc in $BACKEND_SERVICE $FRONTEND_SERVICE
          do
            aws logs delete-log-group --log-group-name /ecs/$ECS_CLUSTER/$svc || true
          done

      - name: Done
        run: echo " Cleanup complete"
