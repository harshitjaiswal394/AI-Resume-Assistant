name: 🚀 Deploy / 💣 Destroy AWS ECS

run-name: >-
  ${{ 
    github.event.inputs.destroy == 'true'
    && format('💣 Destroy {0}', github.event.inputs.environment)
    || format('🚀 Deploy {0}', github.event.inputs.environment)
  }}

on:
  pull_request:
    branches:
      - main
    types:
      - closed

  workflow_dispatch:
    inputs:
      destroy:
        description: "Set true to destroy infrastructure"
        required: true
        default: "false"
      environment:
        description: "Environment (dev/test/prod)"
        required: true
        default: "dev"

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:

# =========================
# DEPLOY JOB
# =========================
  deploy:
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.event.inputs.destroy != 'true') }}
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Validate Environment
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          if [[ ! "$ENV" =~ ^(dev|test|prod)$ ]]; then
            echo "❌ Invalid environment: $ENV"
            exit 1
          fi

      - name: Set Dynamic Variables
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"

          echo "ECS_CLUSTER=${ENV}-jobgpt-cluster" >> $GITHUB_ENV
          echo "ECS_NAMESPACE=${ENV}-jobgpt" >> $GITHUB_ENV

          echo "BACKEND_SERVICE=${ENV}-backend-service" >> $GITHUB_ENV
          echo "FRONTEND_SERVICE=${ENV}-frontend-service" >> $GITHUB_ENV

          echo "ECR_BACKEND_REPO=${ENV}-backend-repo" >> $GITHUB_ENV
          echo "ECR_FRONTEND_REPO=${ENV}-frontend-repo" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECS Cluster Ready
        run: |
          STATUS=$(aws ecs describe-clusters \
            --clusters $ECS_CLUSTER \
            --query 'clusters[0].status' \
            --output text 2>/dev/null || echo "NOT_FOUND")

          if [ "$STATUS" = "ACTIVE" ]; then
            echo "Cluster exists"

          elif [ "$STATUS" = "DEPROVISIONING" ]; then
            echo "Waiting for deletion..."
            sleep 30
            aws ecs create-cluster --cluster-name $ECS_CLUSTER

          else
            aws ecs create-cluster --cluster-name $ECS_CLUSTER
          fi

      - name: Create Namespace
        run: |
          NS=$(aws servicediscovery list-namespaces \
            --query "Namespaces[?Name=='$ECS_NAMESPACE'].Id" \
            --output text)

          if [ -z "$NS" ]; then
            aws servicediscovery create-private-dns-namespace \
              --name $ECS_NAMESPACE \
              --vpc $(aws ec2 describe-vpcs --query 'Vpcs[0].VpcId' --output text)
          fi

      - name: Login to ECR
        run: |
          aws ecr get-login-password | docker login \
          --username AWS \
          --password-stdin \
          $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Create ECR Repos
        run: |
          for repo in $ECR_BACKEND_REPO $ECR_FRONTEND_REPO
          do
            aws ecr describe-repositories --repository-names $repo || \
            aws ecr create-repository --repository-name $repo
          done

      - name: Build & Push Images
        run: |
          docker build -t backend ./backend
          docker tag backend:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND_REPO:latest
          docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_BACKEND_REPO:latest

          docker build -t frontend ./frontend
          docker tag frontend:latest $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPO:latest
          docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPO:latest

      - name: Register Task Definitions
        run: |
          aws ecs register-task-definition --cli-input-json file://backend/backend-task.json
          aws ecs register-task-definition --cli-input-json file://frontend/frontend-task.json

# =========================
# DESTROY JOB
# =========================
  destroy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.destroy == 'true' }}
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Validate Environment
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [[ ! "$ENV" =~ ^(dev|test|prod)$ ]]; then
            echo "❌ Invalid environment"
            exit 1
          fi

      - name: Set Dynamic Variables
        run: |
          ENV="${{ github.event.inputs.environment }}"

          echo "ECS_CLUSTER=${ENV}-jobgpt-cluster" >> $GITHUB_ENV
          echo "ECS_NAMESPACE=${ENV}-jobgpt" >> $GITHUB_ENV

          echo "BACKEND_SERVICE=${ENV}-backend-service" >> $GITHUB_ENV
          echo "FRONTEND_SERVICE=${ENV}-frontend-service" >> $GITHUB_ENV

          echo "ECR_BACKEND_REPO=${ENV}-backend-repo" >> $GITHUB_ENV
          echo "ECR_FRONTEND_REPO=${ENV}-frontend-repo" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete ECS Services
        run: |
          for svc in $BACKEND_SERVICE $FRONTEND_SERVICE
          do
            aws ecs update-service --cluster $ECS_CLUSTER --service $svc --desired-count 0 || true
            sleep 10
            aws ecs delete-service --cluster $ECS_CLUSTER --service $svc --force || true
          done

      - name: Delete Cloud Map Services
        run: |
          NS_ID=$(aws servicediscovery list-namespaces \
            --query "Namespaces[?Name=='$ECS_NAMESPACE'].Id" \
            --output text)

          if [ ! -z "$NS_ID" ]; then
            for svc in $(aws servicediscovery list-services \
              --filters Name=NAMESPACE_ID,Values=$NS_ID \
              --query 'Services[*].Id' \
              --output text)
            do
              aws servicediscovery delete-service --id $svc || true
            done
          fi

      - name: Delete Namespace
        run: |
          NS_ID=$(aws servicediscovery list-namespaces \
            --query "Namespaces[?Name=='$ECS_NAMESPACE'].Id" \
            --output text)

          if [ ! -z "$NS_ID" ]; then
            aws servicediscovery delete-namespace --id $NS_ID || true
          fi

      - name: Delete Task Definitions
        run: |
          for family in backend frontend
          do
            for arn in $(aws ecs list-task-definitions --family-prefix $family --query 'taskDefinitionArns[]' --output text)
            do
              aws ecs deregister-task-definition --task-definition $arn || true
            done
          done

      - name: Delete Cluster
        run: |
          aws ecs delete-cluster --cluster $ECS_CLUSTER || true

      - name: Delete ECR Repos
        run: |
          for repo in $ECR_BACKEND_REPO $ECR_FRONTEND_REPO
          do
            aws ecr delete-repository --repository-name $repo --force || true
          done

      - name: Cleanup Logs
        run: |
          aws logs delete-log-group --log-group-name /ecs/jobgpt-backend || true
          aws logs delete-log-group --log-group-name /ecs/jobgpt-frontend || true

      - name: Done
        run: echo " Cleanup complete"