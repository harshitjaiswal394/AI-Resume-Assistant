      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login \
            --username AWS \
            --password-stdin \
            "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build and push backend image
        run: |
          docker build -t "$BACKEND_REPO:${IMAGE_TAG}" ./backend
          docker tag "$BACKEND_REPO:${IMAGE_TAG}" "$BACKEND_REPO:latest"
          docker push "$BACKEND_REPO:${IMAGE_TAG}"
          docker push "$BACKEND_REPO:latest"

      - name: Build and push frontend image
        run: |
          docker build -t "$FRONTEND_REPO:${IMAGE_TAG}" ./frontend
          docker tag "$FRONTEND_REPO:${IMAGE_TAG}" "$FRONTEND_REPO:latest"
          docker push "$FRONTEND_REPO:${IMAGE_TAG}"
          docker push "$FRONTEND_REPO:latest"

      - name: Terraform Apply
        working-directory: infra/envs/test
        env:
          TF_VAR_nvidia_api_key: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          terraform apply -auto-approve \
            -var="backend_image_tag=${{ env.IMAGE_TAG }}" \
            -var="frontend_image_tag=${{ env.IMAGE_TAG }}"

  plan-prod:
    if: github.event.pull_request.merged == true
    needs: apply-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
